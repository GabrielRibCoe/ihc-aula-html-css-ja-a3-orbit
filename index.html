<!doctype html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <!-- Meta tags, título e links para CSS (Bootstrap, Swiper, ícones) -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orbit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-image: linear-gradient(to right, #141425, #1f1c3e);
        }
    
        .orbitmain {
            background-color: #6610f2;
        }

        .orbitdark {
            color: #230752;
        }

        /* Swiper Em Alta */
        .swiper-slide {
            width: 35%;
            height: auto;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .swiper-slide:hover .info-jogo {
            opacity: 1 !important;
        }

        .swiper-slide-active {
            opacity: 1;
        }

        .desc-limitada {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-size: 0.8rem;
            opacity: 0.85;
            line-height: 1.3;
        }

        .mySwiper {
            padding-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        .mySwiper::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 300px;
            background: linear-gradient(to left, transparent, #141425);
            pointer-events: none;
            z-index: 5;
        }

        .mySwiper::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 300px;
            background: linear-gradient(to right, transparent, #1f1c3e);
            pointer-events: none;
            z-index: 5;
        }

        .swiper-button-next,
        .swiper-button-prev {
            position: static;
            width: auto;
            height: auto;
            margin: 0;
            background: none;
            color: inherit;
        }

        .swiper-button-next::after,
        .swiper-button-prev::after {
            display: none;
        }

        .swiper-pagination-bullet {
            background-color: rgba(255, 255, 255, 0.5);
        }

        .swiper-pagination-bullet-active {
            background-color: #6610f2;
        }

        /* Cards de categoria */
        .card-jogo {
            transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
        }

        .card-jogo:hover {
            box-shadow: 0 8px 25px rgba(102, 16, 242, 0.4);
            filter: brightness(1.1);
        }

        @media (prefers-reduced-motion: no-preference) {
            .card-jogo:hover {
                transform: scale(1.05) translateY(-10px);
            }
        }

        /* Slider de categorias */
        .categoria-slider {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding-bottom: 1rem;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
            scrollbar-color: #6610f2 #1a1a2e;
        }

        .categoria-slider::-webkit-scrollbar {
            height: 5px;
        }

        .categoria-slider::-webkit-scrollbar-track {
            background: #1a1a2e;
            border-radius: 10px;
        }

        .categoria-slider::-webkit-scrollbar-thumb {
            background: #6610f2;
            border-radius: 10px;
        }

        .categoria-card {
            min-width: 300px;
            max-width: 300px;
            scroll-snap-align: start;
            flex-shrink: 0;
        }

        .btn-scroll {
            background: none;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            transition: color 0.2s;
            padding: 0;
        }

        .btn-scroll:hover {
            color: #6610f2;
        }

        .secao-categoria {
            margin-bottom: 3rem;
        }

    </style>
</head>

<body>

    <!-- Scripts do Bootstrap, Swiper e código customizado -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg orbitmain">
        <div class="container-xl">

            <!-- Logo clicável, redireciona para a página inicial-->
            <a class="navbar-brand active" href="index.html" data-bs-toggle="tooltip" data-bs-placement="bottom"
                title="Página Inicial">
                <img src=" ./orbitlogo.png" alt="Logo" width="125" height="75" class="object-fit-cover" />

            <!-- Botão para expandir menu em telas menores-->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"

                <!-- Campo de busca-->
                <form class="d-flex" role="search" onsubmit="buscar(event)">

                    <button class="btn btn-outline-light" type="submit">Buscar</button>

    <!-- Modal de cadastro -->
    <div class="modal fade" id="modalLogin" tabindex="-1" aria-labelledby="modalLoginLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: #1a1a2e; border: 1px solid #6610f2;">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-white" id="modalLoginLabel">Criar conta</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">

                        <!-- Campos para nome de usuário, email e senha -->
                        <label class="form-label text-light">Nome de usuário</label>
                        <input type="text" class="form-control" id="inputUsuario" placeholder="Seu nome de usuário"
                               style="background-color: #0d0d1a; border-color: #6610f2; color: white;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-light">Email</label>
                        <input type="email" class="form-control" id="inputEmail" placeholder="seu@email.com"

                    </div>
                    <div class="mb-3">
                        <label class="form-label text-light">Senha</label>
                        <input type="password" class="form-control" id="inputSenha" placeholder="••••••••"

                    </div>
                    <p id="erroLogin" class="text-danger" style="font-size: 0.85rem; display: none;"></p>
                </div>

                <!-- Botão de criação de conta -->
                <div class="modal-footer border-0">
                    <button type="button" class="btn w-100 text-white fw-bold" style="background-color: #6610f2;"

        </div>

    <div class="d-flex flex-column align-items-stretch mt-5 mb-5">

        <!-- Banner Festival de Promoções -->
        <div class="container-xl mb-5">
            <a href="festival.html" style="display: block; text-decoration: none;">
                <div class="position-relative rounded-3 overflow-hidden" style="cursor: pointer;">
                    <img src="./festivalImg.jpg" alt="Festival de Promoções" class="w-100" style="height: 220px; object-fit: cover; filter: brightness(0.5);">
                    <div class="position-absolute top-50 start-50 translate-middle text-center text-white px-4">
                        <h2 class="fw-bold mb-1" style="font-size: 2rem; text-shadow: 0 2px 8px rgba(0,0,0,0.8);">
                            🎉 Festival de Promoções da <span style="color: #a855f7;">A3</span>
                        </h2>
                        <p class="mb-2" style="font-size: 1.1rem; text-shadow: 0 2px 6px rgba(0,0,0,0.8);">
                            Jogos com até 60% de desconto, venha conferir!
                        </p>
                        <span class="btn text-white fw-bold px-4 py-2" style="background-color: #6610f2; border-radius: 30px; font-size: 0.95rem;">
                            Ver ofertas →
                        </span>
                    </div>
                </div>
            </a>
        </div>

        <!-- Seção Em Alta -->
        <section class="mt-2 mb-5 flex-shrink-0">
            <div class="container-xl d-flex flex-row align-items-center justify-content-between mb-3">
                <h1>Em alta</h1>
                <div class="setas d-flex flex-row align-items-center gap-3">
                    <i class="bi bi-arrow-left-circle swiper-button-prev" style="cursor: pointer; font-size: 2rem;"></i>
                    <i class="bi bi-arrow-right-circle swiper-button-next"
                        style="cursor: pointer; font-size: 2rem;"></i>
                </div>
            </div>
            <div class="swiper mySwiper p-3">
                <div class="swiper-wrapper" id="slider"></div>
            </div>
        </section>

        <!-- Seções de categorias geradas pelo JS -->
        <div class="container-xl" id="secoes-categorias">
            <!-- Preenchido dinamicamente pelo JS -->
        </div>

    </div>

    <!-- Rodapé -->
    <div class="container-xl mb-5">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item text-muted text-center">
                <a class="nav-link text-light" href="catalogo.html">Não encontrou o que você procura? Visite o nosso catálogo!</a>
            </li>
        </ul>
    
        <hr>
        <p class="text-center text-muted">© 2026 Orbit. Todos os direitos reservados.</p>
    </div>

    
    <script>
        // ── Swiper Em Alta ──────────────────────────────────────────────
        const swiper = new Swiper('.mySwiper', {
            slidesPerView: 3.1,
            spaceBetween: 70,
            loop: true,
            autoplay: { delay: 2300, disableOnInteraction: false },
            navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' },
            pagination: { el: '.swiper-pagination', clickable: true },
        });

        const API_KEY = 'c3c539ca3bd243f5939861bf749e43e7';

        // ── Utilitários ─────────────────────────────────────────────────

        // Gerador de preço determinístico baseado no ID do jogo (para simular preços reais sem precisar de uma API de preços)
        function gerarPreco(id) {
            const semente = id * 9301 + 49297;
            const pseudo = (semente % 233280) / 233280;
            return (pseudo * 280 + 20).toFixed(2);
        }

        // Retorna { emPromocao, precoOriginal, precoAtual, desconto }
        function gerarPromocao(id) {
            // ~1 em cada 4 jogos entra em promoção (quando id % 4 === 0), para assim escolher 1/4 dos jogos
            const emPromocao = (id % 4 === 0);
            const precoOriginal = parseFloat(gerarPreco(id));

            if (!emPromocao) return { emPromocao: false, precoOriginal, precoAtual: precoOriginal, desconto: 0 };

            // Desconto determinístico entre 10% e 60%
            const descontoSemente = (id * 1234567) % 100;
            const desconto = 10 + (descontoSemente % 51); // 10 a 60
            const precoAtual = (precoOriginal * (1 - desconto / 100)).toFixed(2);

            return { emPromocao: true, precoOriginal: precoOriginal.toFixed(2), precoAtual, desconto };
        }

        // Implementa o preço do jogo, caso o jogo não esteja em promoção, mostra o preço normal, caso contrário, mostra o preço original riscado, o preço com desconto e a porcentagem de desconto. Tudo isso usando a função gerarPromocao(id) para obter os dados de preço e promoção.
        function montaPreco(id) {
            const promo = gerarPromocao(id);
            if (!promo.emPromocao) {
                return `<span class="fw-bold" style="font-size: 0.9rem;">R$ ${promo.precoOriginal}</span>`;
            }
            return `
                <div class="d-flex flex-column gap-0">
                    <div class="d-flex align-items-center gap-1">
                        <span class="badge text-white" style="background-color: #6610f2; font-size: 0.7rem;">-${promo.desconto}%</span>
                        <span class="text-muted text-decoration-line-through" style="font-size: 0.75rem;">R$ ${promo.precoOriginal}</span>
                    </div>
                    <span class="fw-bold text-warning" style="font-size: 0.95rem;">R$ ${promo.precoAtual}</span>
                </div>
            `;
        }

        // ── Descrições personalizadas (Em Alta) ─────────────────────────
        const descricoes = {
            'Resident Evil 9: Requiem': 'Réquiem para os mortos, pesadelo para os vivos. Raccoon City te espera.',
            'Pragmata': 'Acompanhe Hugh, membro de uma arruinada equipe de investigação, e Diana, um androide, enquanto exploram uma instalação lunar controlada por uma IA rebelde e tentam voltar à Terra.',
            'Replaced': 'Enfrente as consequências das ações da Corporação Fênix pelos olhos de sua própria criação, R.E.A.C.H., uma inteligência artificial presa em um corpo humano.',
            'Crimson Desert': 'Bem-vindo a Pywel. Das regiões selvagens e cidades ao misterioso Abismo, forje seu caminho com batalhas e descobertas.',
            'Reanimal': 'O medo voltou a ter quatro patas. Fuja, sobreviva e descubra os segredos sombrios que habitam as profundezas desta floresta.',
            'MOUSE: P.I. For Hire': 'Noir, estilo e caos em cada quadro. Uma aventura de ação inspirada nos clássicos animados dos anos 30 — com muito mais violência.',
            'Directive 8020': 'Comunicação recebida. Origem desconhecida. Em algum lugar entre as estrelas, algo está te esperando — e nem sempre com boas intenções.',
            'Forza Horizon 6': 'Velocidade sem limites. O festival mais aguardado do mundo dos games volta com novos cenários, carros e adrenalina do início ao fim.',
            'Cairn': 'Cada passo pode ser o último. Uma escalada técnica e brutal que desafia não só seus reflexos, mas sua vontade de chegar ao topo.',
            'Mewgenics': 'Gatos, caos e genética absurda. Crie, evolua e sobreviva numa aventura roguelike tão imprevisível quanto os próprios felinos.',
            'Marathon': 'Jogue como um Corredor biocibernético e explore a colônia perdida de Tau Ceti IV no FPS PvPvE de extração dos criadores de Halo e Destiny.',
            'Mixtape': 'Na última noite no colégio, três amigos embarcam em mais uma aventura juntos. Jogue uma coletânea de lembranças, na companhia da trilha sonora de uma geração.',
            'Slay the Spire 2': 'O espiral chama de novo. Construa seu deck, enfrente relíquias amaldiçoadas e descubra por que ninguém sai ileso da segunda subida.',
        };



        // ── Filtro NSFW (aplicado em todas as seções) ───────────────────
        const TAGS_BLOQUEADAS = ['nsfw', 'adult', 'hentai', 'eroge', 'sexual-content', 'nudity', 'explicit'];

        function filtrarNSFW(jogos) {
            return jogos.filter(jogo => {
                // Bloqueia por tag
                const tags = jogo.tags?.map(t => t.slug) ?? [];
                if (tags.some(tag => TAGS_BLOQUEADAS.includes(tag))) return false;
                // Bloqueia jogos sem avaliações suficientes (menos de 10 avaliações = obscuro demais)
                if ((jogo.ratings_count ?? 0) < 10) return false;
                return true;
            });
        }

        // ── Em Alta ─────────────────────────────────────────────────────
        async function carregarJogos(pagina) {
            const response = await fetch(
                `https://api.rawg.io/api/games?key=${API_KEY}&dates=2026-01-01,2026-05-24&ordering=-added&page_size=20&page=${pagina}&exclude_additions=true&exclude_tags=nsfw,adult,hentai,eroge`
            );
            const data = await response.json();
            return data;
        }

        const listaJogos = carregarJogos(1);

        listaJogos.then(jogos => {
            const slider = document.getElementById('slider');
            const jogosFiltrados = filtrarNSFW(jogos.results).slice(0, 15);
            jogosFiltrados.forEach(jogo => {
                const descricao = descricoes[jogo.name] ?? 'Em breve mais informações sobre este título.';
                const slide = document.createElement('div');
                slide.classList.add('swiper-slide');
                slide.innerHTML = `
                    <div class="d-flex flex-row align-items-stretch rounded-3 overflow-hidden shadow w-100 position-relative"
                         style="background-color: #31054a; height: 400px;"
                         onclick="window.location.href='produto.html?id=${jogo.id}'">
                        <div class="img-jogo flex-shrink-0" style="width: 100%; background-color: #d3d3d3;">
                            <img src="${jogo.background_image}" class="w-100 h-100" style="object-fit: cover;" alt="Imagem do jogo" />
                        </div>
                        <div class="info-jogo d-flex flex-column text-white w-100 position-absolute bottom-0 start-0 end-0"
                             style="background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); padding: 2rem 1rem 1rem; opacity: 0; transition: opacity 0.3s ease;">
                            <h2 class="m-0 fs-4 fw-bold">${jogo.name}</h2>
                            <p class="mt-2 mb-0 desc-limitada">${descricao}</p>
                        </div>
                    </div>
                `;
                slider.appendChild(slide);
            });
            swiper.update();
        });

        // ── Categorias de destaque ──────────────────────────────────────
        const CATEGORIAS = [
            { id: 'acao', nome: '🔥 Jogos de Ação', generoId: 4, paginaAleatoria: Math.ceil(Math.random() * 5) },
            { id: 'aventura', nome: '🗺️ Jogos de Aventura', generoId: 3, paginaAleatoria: Math.ceil(Math.random() * 5) },
            { id: 'rpg', nome: '⚔️ Jogos de RPG', generoId: 5, paginaAleatoria: Math.ceil(Math.random() * 5) },
            { id: 'estrategia', nome: '🧩 Jogos de Puzzle & Estratégia', generoId: 10, paginaAleatoria: Math.ceil(Math.random() * 5) },
            { id: 'corrida', nome: '🏎️ Jogos de Corrida & Esportes', generoId: 1, paginaAleatoria: Math.ceil(Math.random() * 5) },
        ];

        async function carregarCategoria(categoria) {
            const response = await fetch(
                `https://api.rawg.io/api/games?key=${API_KEY}&genres=${categoria.generoId}&ordering=-rating&metacritic=60,100&page_size=10&page=${categoria.paginaAleatoria}&exclude_additions=true&exclude_tags=nsfw,adult,hentai,eroge`
            );
            const data = await response.json();
            return filtrarNSFW(data.results ?? []).slice(0, 6);
        }

        function montaCardCategoria(jogo) {
            const generos = jogo.genres?.map(g => g.name).join(', ') ?? '';
            const capa = jogo.background_image ?? 'imagem-padrao.jpg';
            const promo = gerarPromocao(jogo.id);
            return `
                <div class="categoria-card" onclick="window.location.href='produto.html?id=${jogo.id}'">
                    <div class="card-jogo d-flex flex-column rounded-3 h-100 w-100" style="overflow: visible; position: relative;">
                        ${promo.emPromocao ? `<span class="badge position-absolute top-0 end-0 m-2 text-white" style="background-color:#6610f2; z-index:1;">-${promo.desconto}% OFF</span>` : ''}
                        <img src="${capa}" style="height: 200px; object-fit: cover; width: 100%; border-radius: 0.375rem 0.375rem 0 0;" alt="${jogo.name}">
                        <div class="d-flex flex-column text-white flex-grow-1" style="background-color: #230752; padding: 0.75rem; border-radius: 0 0 0.375rem 0.375rem;">
                            <h6 class="mb-1" style="font-size: 0.85rem; line-height: 1.3;">${jogo.name}</h6>
                            <p class="text-muted mb-2" style="font-size: 0.75rem;">${generos}</p>
                            <div class="mt-auto d-flex align-items-center justify-content-between">
                                ${montaPreco(jogo.id)}
                                <a href="produto.html?id=${jogo.id}" class="btn orbitmain btn-sm text-white"
                                   style="font-size: 0.75rem; padding: 0.2rem 0.6rem; cursor: pointer;"
                                   onclick="event.stopPropagation()">Ver jogo</a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function montaSecao(categoria, jogos) {
            const sliderId = `slider-${categoria.id}`;
            const html = `
                <section class="secao-categoria">
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <h3 class="mb-0">${categoria.nome}</h3>
                        <div class="d-flex gap-2 align-items-center">
                            <button class="btn-scroll" onclick="scrollCategoria('${sliderId}', -1)">
                                <i class="bi bi-arrow-left-circle"></i>
                            </button>
                            <button class="btn-scroll" onclick="scrollCategoria('${sliderId}', 1)">
                                <i class="bi bi-arrow-right-circle"></i>
                            </button>
                            <a href="catalogo.html" class="btn btn-sm btn-outline-light ms-2" style="font-size: 0.8rem;">
                                Ver todos <i class="bi bi-arrow-right"></i>
                            </a>
                        </div>
                    </div>
                    <div class="categoria-slider" id="${sliderId}">
                        ${jogos.map(j => montaCardCategoria(j)).join('')}
                    </div>
                </section>
            `;
            return html;
        }

        function scrollCategoria(sliderId, direcao) {
            const el = document.getElementById(sliderId);
            el.scrollBy({ left: direcao * 440, behavior: 'smooth' });
        }

        async function carregarTodasCategorias() {
            const container = document.getElementById('secoes-categorias');
            for (const categoria of CATEGORIAS) {
                const jogos = await carregarCategoria(categoria);
                if (jogos.length > 0) {
                    container.innerHTML += montaSecao(categoria, jogos);
                }
            }
        }

        carregarTodasCategorias();

        //Ativar tooltips do Bootstrap
        document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => {
            new bootstrap.Tooltip(el);
        });

        // ── Sistema de login ────────────────────────────────────────────
        function atualizarAreaLogin() {
            const usuario = localStorage.getItem('orbitUsuario');
            const area = document.getElementById('areaLogin');

            if (usuario) {
                // Usuário logado: mostra o nome com opção de sair
                area.innerHTML = `
                    <div class="dropdown">
                        <span class="text-white fw-bold dropdown-toggle" style="cursor:pointer; font-size:0.95rem;"
                              data-bs-toggle="dropdown">
                            👤 ${usuario}
                        </span>
                        <ul class="dropdown-menu dropdown-menu-end" style="background-color:#1a1a2e; border-color:#6610f2;">
                            <li>
                                <button class="dropdown-item text-danger" onclick="sairConta()">
                                    Sair
                                </button>
                            </li>
                        </ul>
                    </div>
                `;
            } else {
                // Não logado: mostra ícone de login
                area.innerHTML = `
                    <img src="./LoginIcon.png" alt="Login" width="36" height="36"
                         style="cursor:pointer;"
                         data-bs-toggle="modal" data-bs-target="#modalLogin"
                         title="Criar conta / Entrar">
                `;
            }
        }

        function criarConta() {
            const usuario = document.getElementById('inputUsuario').value.trim();
            const email   = document.getElementById('inputEmail').value.trim();
            const senha   = document.getElementById('inputSenha').value;
            const erro    = document.getElementById('erroLogin');

            if (!usuario || !email || !senha) {
                erro.textContent = 'Por favor, preencha todos os campos.';
                erro.style.display = 'block';
                return;
            }

            if (senha.length < 6) {
                erro.textContent = 'A senha deve ter pelo menos 6 caracteres.';
                erro.style.display = 'block';
                return;
            }

            // Salva no localStorage
            localStorage.setItem('orbitUsuario', usuario);
            localStorage.setItem('orbitEmail', email);

            // Fecha o modal e atualiza a navbar
            bootstrap.Modal.getInstance(document.getElementById('modalLogin')).hide();
            atualizarAreaLogin();

            // Limpa os campos
            document.getElementById('inputUsuario').value = '';
            document.getElementById('inputEmail').value = '';
            document.getElementById('inputSenha').value = '';
            erro.style.display = 'none';
        }

        function sairConta() {
            localStorage.removeItem('orbitUsuario');
            localStorage.removeItem('orbitEmail');
            atualizarAreaLogin();
        }

        // Inicializa ao carregar a página
        atualizarAreaLogin();

        // ── Busca ────────────────────────────────────────────────
        function buscar(event) {
            event.preventDefault();
            const termo = document.getElementById('campoBusca').value.trim();
            if (termo) {
                window.location.href = `resultado.html?q=${encodeURIComponent(termo)}`;
            }
        }
    </script>


</body>
