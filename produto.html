<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orbit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        .orbitmain {
            background-color: #6610f2;
        }

        .orbitdark {
            color: #230752;
        }

        #capa {
            max-height: 400px;
            object-fit: cover;
            width: 100%;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

    <!--Barra de navegação-->
    <nav class="navbar navbar-expand-lg orbitmain">
        <div class="container-xl">

            <a class="navbar-brand" href="index.html">
                <img src="./orbitlogo.png" alt="Logo" width="125" height="75" class="object-fit-cover" />
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-light" href="biblioteca.html">Biblioteca</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="catalogo.html">Catálogo</a>
                    </li>
                </ul>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a class="nav-link text-light" href="carrinho.html">
                        <img src="./carrinhoicon.png" alt="Carrinho" width="30" height="30" class="m-3" />
                    </a>
                </div>

                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="..." aria-label="Search" />
                    <button class="btn btn-outline-light" type="submit">Buscar</button>
                </form>

            </div>
        </div>
    </nav>

    <!-- Conteúdo do produto -->
    <div class="container mt-5">
        <div class="row g-4">

            <!-- Imagem do jogo -->
            <div class="col-md-6">
                <img id="capa" src="" alt="Capa do jogo">
            </div>

            <!-- Informações do jogo -->
            <div class="col-md-6">
                <h1 id="nome" class="mb-2"></h1>
                <p id="generos" class="text-muted mb-3"></p>
                <p id="avaliacao" class="mb-3"></p>
                <p id="descricao" class="mb-4"></p>
                <p id="preco" class="fs-4 fw-bold mb-4"></p>
                <button class="btn btn-primary btn-lg">Adicionar ao Carrinho</button>
            </div>

        </div>
    </div>

    <!-- Script DEPOIS do HTML -->
    <script>
        const API_KEY = 'SUA_KEY_AQUI';

        const id = new URLSearchParams(window.location.search).get('id');

        fetch(`https://api.rawg.io/api/games/${id}?key=${API_KEY}`)
            .then(r => r.json())
            .then(jogo => {
                // Título da aba do navegador
                document.title = jogo.name + ' — Orbit';

                document.getElementById('nome').textContent = jogo.name;
                document.getElementById('capa').src = jogo.background_image ?? 'imagem-padrao.jpg';
                document.getElementById('capa').alt = jogo.name;
                document.getElementById('avaliacao').textContent = `Avaliação: ${jogo.rating}/5 ⭐ (${jogo.ratings_count} avaliações)`;
                document.getElementById('descricao').textContent = jogo.description_raw ?? 'Sem descrição disponível.';
                document.getElementById('generos').textContent = jogo.genres?.map(g => g.name).join(', ') ?? '';

                const preco = (Math.random() * 150 + 20).toFixed(2);
                document.getElementById('preco').textContent = `R$ ${preco}`;
            })
            .catch(() => {
                document.getElementById('nome').textContent = 'Jogo não encontrado.';
            });
    </script>

</body>

</html>
