<!doctype html>

<html lang="pt-br" data-bs-theme="dark">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orbit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <script>
        const CLIENT_ID = 'Iwo5t037sfnyjhhxe0jdygp4enrizx';
        const ACCESS_TOKEN = 'mlrn7b2p2r985327qpw3zgldtz262h';

        async function carregarJogos() {
            const response = await fetch('https://cors-proxy.igdb.com/v4/games', {
                method: 'POST',
                headers: {
                    'Client-ID': CLIENT_ID,
                    'Authorization': `Bearer ${ACCESS_TOKEN}`,
                    'Content-Type': 'text/plain'
                },
                body: `
      fields name, summary, cover.url, rating, genres.name;
      limit 20;
      sort rating desc;
      where rating > 75 & cover != null;
    `
            });

            const jogos = await response.json();
            renderizarJogos(jogos);
        }

        function renderizarJogos(jogos) {
            const container = document.getElementById('catalogo');

            jogos.forEach(jogo => {
                // A URL da capa vem como //images.igdb.com/..., precisa adicionar https:
                const capa = jogo.cover
                    ? 'https:' + jogo.cover.url.replace('t_thumb', 't_cover_big')
                    : 'imagem-padrao.jpg';

                const preco = (Math.random() * 150 + 20).toFixed(2); // preço simulado

                container.innerHTML += `
      <div class="col-md-3 mb-4">
        <div class="card h-100">
          <img src="${capa}" class="card-img-top" alt="${jogo.name}">
          <div class="card-body">
            <h5 class="card-title">${jogo.name}</h5>
            <p class="card-text">${jogo.summary?.substring(0, 100) ?? ''}...</p>
            <p class="fw-bold">R$ ${preco}</p>
            <a href="produto.html?id=${jogo.id}" class="btn btn-primary">Ver jogo</a>
          </div>
        </div>
      </div>
    `;
            });
        }

        carregarJogos();
    </script>
    <style>
        .orbitmain {
            background-color: #6610f2;
        }

        .orbitdark {
            color: #230752;
        }
    </style>

</head>

<body>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <!--Textos interativos-->

                    <li class="nav-item">
                        <a class="nav-link text-light" aria-current="page" href="biblioteca.html">Biblioteca</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active text-light" href="catalogo.html">Catalogo</a>
                    </li>

                </ul>

                <!--Carrinho-->

                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
