<!doctype html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orbit — Catálogo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        body {
            background-image: linear-gradient(to right, #141425, #1f1c3e);
        }

        .orbitmain {
            background-color: #6610f2;
        }

        .orbitdark {
            color: #230752;
        }

        /* Paginação */
        .page-item.active .page-link {
            background-color: #6610f2;
            border-color: #6610f2;
        }

        .page-link {
            color: #6610f2;
        }

        .page-link:hover {
            color: #4a0ab5;
        }

        /* Cards */
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 8px 24px rgba(102, 16, 242, 0.4);
            filter: brightness(1.1);
        }

        /* Barra lateral */
        #sidebar {
            min-width: 220px;
            max-width: 220px;
            background-color: #1a1a2e;
            border-radius: 10px;
            padding: 1.2rem;
            height: fit-content;
        }

        #sidebar h6 {
            color: #6610f2;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.08em;
            margin-bottom: 0.5rem;
            margin-top: 1rem;
            border-bottom: 1px solid #6610f222;
            padding-bottom: 0.3rem;
        }

        #sidebar h6:first-child {
            margin-top: 0;
        }

        .form-check-label {
            font-size: 0.85rem;
            cursor: pointer;
        }

        .form-check-input:checked {
            background-color: #6610f2;
            border-color: #6610f2;
        }

        /* Preço range */
        #precoRange::-webkit-slider-thumb {
            background: #6610f2;
        }

        #precoRange {
            accent-color: #6610f2;
        }

        .btn-filtrar {
            background-color: #6610f2;
            color: white;
            border: none;
            width: 100%;
            margin-top: 1rem;
            font-size: 0.85rem;
        }

        .btn-filtrar:hover {
            background-color: #4a0ab5;
            color: white;
        }

        .btn-limpar {
            background: transparent;
            color: #aaa;
            border: 1px solid #444;
            width: 100%;
            margin-top: 0.4rem;
            font-size: 0.8rem;
        }

        .btn-limpar:hover {
            color: white;
            border-color: #888;
        }
    </style>
</head>

<body>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg orbitmain">
        <div class="container-xl">
            <a class="navbar-brand active" href="index.html" data-bs-toggle="tooltip" data-bs-placement="bottom"
                title="Página Inicial">
                <img src=" ./orbitlogo.png" alt="Logo" width="125" height="75" class="object-fit-cover" />
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-light" href="biblioteca.html">Biblioteca</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active text-light" href="catalogo.html">Catálogo</a>
                    </li>
                </ul>
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a class="nav-link text-light" href="carrinho.html">
                        <img src="./carrinhoicon.png" alt="Carrinho" width="30" height="30" class="m-3" />
                    </a>
                </div>
                <form class="d-flex" role="search" onsubmit="buscar(event)">
                    <input class="form-control me-2" type="search" id="campoBusca" placeholder="Buscar jogos..." aria-label="Search" style="background-color: #1f1c3e;" />
                    <button class="btn btn-outline-light" type="submit">Buscar</button>
                </form>

                <!-- Login -->
                <div class="ms-3 d-flex align-items-center" id="areaLogin">
                </div>
            </div>
        </div>
    </nav>

    <!-- Modal de cadastro -->
    <div class="modal fade" id="modalLogin" tabindex="-1" aria-labelledby="modalLoginLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: #1a1a2e; border: 1px solid #6610f2;">
                <div class="modal-header border-0">
                    <h5 class="modal-title text-white" id="modalLoginLabel">Criar conta</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label text-light">Nome de usuário</label>
                        <input type="text" class="form-control" id="inputUsuario" placeholder="Seu nome de usuário"
                            style="background-color: #0d0d1a; border-color: #6610f2; color: white;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-light">Email</label>
                        <input type="email" class="form-control" id="inputEmail" placeholder="seu@email.com"
                            style="background-color: #0d0d1a; border-color: #6610f2; color: white;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-light">Senha</label>
                        <input type="password" class="form-control" id="inputSenha" placeholder="••••••••"
                            style="background-color: #0d0d1a; border-color: #6610f2; color: white;">
                    </div>
                    <p id="erroLogin" class="text-danger" style="font-size: 0.85rem; display: none;"></p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn w-100 text-white fw-bold" style="background-color: #6610f2;"
                        onclick="criarConta()">Criar conta</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container-xl mt-4">
        <div class="d-flex gap-4 align-items-start">

            <!-- Barra lateral de filtros -->
            <div id="sidebar">

                <h6>Plataforma</h6>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="4" id="pc"><label
                        class="form-check-label" for="pc">PC</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="187" id="ps5"><label
                        class="form-check-label" for="ps5">PlayStation 5</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="18" id="ps4"><label
                        class="form-check-label" for="ps4">PlayStation 4</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="1" id="xbox"><label
                        class="form-check-label" for="xbox">Xbox</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="7" id="switch"><label
                        class="form-check-label" for="switch">Nintendo Switch</label></div>

                <h6>Gênero</h6>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="4" id="acao"><label
                        class="form-check-label" for="acao">Ação</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="3" id="aventura"><label
                        class="form-check-label" for="aventura">Aventura</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="5" id="rpg"><label
                        class="form-check-label" for="rpg">RPG</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="2" id="tiro"><label
                        class="form-check-label" for="tiro">Tiro</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="10"
                        id="estrategia"><label class="form-check-label" for="estrategia">Estratégia</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="11" id="arcade"><label
                        class="form-check-label" for="arcade">Arcade</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="83"
                        id="plataforma"><label class="form-check-label" for="plataforma">Plataforma</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="7" id="puzzle"><label
                        class="form-check-label" for="puzzle">Puzzle</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="14" id="simulacao"><label
                        class="form-check-label" for="simulacao">Simulação</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="17" id="corrida"><label
                        class="form-check-label" for="corrida">Corrida</label></div>

                <h6>Nº de Players</h6>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="single-player"
                        id="single"><label class="form-check-label" for="single">Single Player</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="multiplayer"
                        id="multi"><label class="form-check-label" for="multi">Multiplayer Online</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="local-multiplayer"
                        id="local"><label class="form-check-label" for="local">Multiplayer Local</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="co-op" id="coop"><label
                        class="form-check-label" for="coop">Co-op</label></div>

                <h6>Preço máximo</h6>
                <input type="range" class="form-range" id="precoRange" min="20" max="300" value="300" step="10">
                <div class="text-center" style="font-size: 0.85rem;">Até R$ <span id="precoValor">300</span></div>

                <button class="btn btn-filtrar" onclick="aplicarFiltros()">Filtrar</button>
                <button class="btn btn-limpar" onclick="limparFiltros()">Limpar filtros</button>
            </div>

            <!-- Conteúdo principal -->
            <div class="flex-grow-1">
                <div class="row" id="catalogo">
                    <!-- Cards gerados pelo JS -->
                </div>
                <nav class="mt-4 mb-5" aria-label="Paginação do catálogo">
                    <ul class="pagination justify-content-center" id="paginacao"></ul>
                </nav>
            </div>

        </div>
    </div>

    <div class="container-xl mb-5">
        <hr>
        <p class="text-center text-muted">© 2026 Orbit. Todos os direitos reservados.</p>
    </div>

    <script>
        const API_KEY = 'c3c539ca3bd243f5939861bf749e43e7';
        const JOGOS_POR_PAGINA = 20;
        const TAGS_BLOQUEADAS = ['nsfw', 'adult', 'hentai', 'eroge', 'sexual-content', 'nudity', 'explicit'];

        let paginaAtual = 1;
        let totalPaginas = 1;
        let precoMaximo = 300;

        // Atualiza label do range de preço
        document.getElementById('precoRange').addEventListener('input', function () {
            precoMaximo = this.value;
            document.getElementById('precoValor').textContent = this.value;
        });

        function getCheckedValues(name) {
            return [...document.querySelectorAll(`#sidebar input[type=checkbox][value="${name}"]`)]
                .filter(el => el.checked)
                .map(el => el.value);
        }

        function getAllChecked(groupIds) {
            return groupIds
                .map(id => document.getElementById(id))
                .filter(el => el && el.checked)
                .map(el => el.value);
        }

        function aplicarFiltros() {
            paginaAtual = 1;
            carregarJogos(1);
        }

        function limparFiltros() {
            document.querySelectorAll('#sidebar input[type=checkbox]').forEach(el => el.checked = false);
            document.getElementById('precoRange').value = 300;
            document.getElementById('precoValor').textContent = '300';
            precoMaximo = 300;
            paginaAtual = 1;
            carregarJogos(1);
        }

        async function carregarJogos(pagina) {
            document.getElementById('catalogo').innerHTML = '<p class="text-center w-100 mt-4">Carregando...</p>';

            // Monta os parâmetros de filtro
            const plataformas = getAllChecked(['pc', 'ps5', 'ps4', 'xbox', 'switch']);
            const generos = getAllChecked(['acao', 'aventura', 'rpg', 'tiro', 'estrategia', 'arcade', 'plataforma', 'puzzle', 'simulacao', 'corrida']);
            const players = getAllChecked(['single', 'multi', 'local', 'coop']);

            let url = `https://api.rawg.io/api/games?key=${API_KEY}&ordering=-metacritic&metacritic=70,100&page_size=${JOGOS_POR_PAGINA}&page=${pagina}&exclude_additions=true&exclude_tags=nsfw,adult,hentai,eroge`;

            if (plataformas.length) url += `&platforms=${plataformas.join(',')}`;
            if (generos.length) url += `&genres=${generos.join(',')}`;
            if (players.length) url += `&tags=${players.join(',')}`;

            const response = await fetch(url);
            const data = await response.json();

            totalPaginas = Math.ceil(data.count / JOGOS_POR_PAGINA);

            renderizarJogos(data.results);
            renderizarPaginacao();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderizarJogos(jogos) {
            const container = document.getElementById('catalogo');
            container.innerHTML = '';

            const jogosFiltrados = jogos.filter(jogo => {
                const tags = jogo.tags?.map(t => t.slug) ?? [];
                return !tags.some(tag => TAGS_BLOQUEADAS.includes(tag));
            });

            jogosFiltrados.forEach(jogo => {
                const capa = jogo.background_image ?? 'imagem-padrao.jpg';
                const promo = gerarPromocao(jogo.id);

                // Filtra pelo preço máximo (usa preço atual se em promoção)
                const precoParaFiltro = promo.emPromocao ? parseFloat(promo.precoAtual) : promo.precoOriginal;
                if (precoParaFiltro > parseFloat(precoMaximo)) return;

                container.innerHTML += `
                    <div class="col-md-4 col-lg-3 mb-4">
                        <div class="card h-100 position-relative">
                            ${promo.emPromocao ? `<span class="badge position-absolute top-0 end-0 m-2 text-white" style="background-color:#6610f2; z-index:1;">-${promo.desconto}% OFF</span>` : ''}
                            <img src="${capa}" class="card-img-top" alt="${jogo.name}" style="height: 160px; object-fit: cover;">
                            <div class="card-body" style="background-color: #230752;">
                                <h5 class="card-title" style="font-size: 0.95rem;">${jogo.name}</h5>
                                <p class="text-muted" style="font-size: 0.8rem;">${jogo.genres?.map(g => g.name).join(', ') ?? ''}</p>
                                ${montaPreco(jogo.id)}
                                <a href="produto.html?id=${jogo.id}" class="btn orbitmain text-white btn-sm">Ver jogo</a>
                            </div>
                        </div>
                    </div>
                `;
            });

            if (container.innerHTML === '') {
                container.innerHTML = '<p class="text-center w-100 mt-4">Nenhum jogo encontrado com esses filtros.</p>';
            }
        }

        function gerarPreco(id) {
            const semente = id * 9301 + 49297;
            const pseudo = (semente % 233280) / 233280;
            return (pseudo * 280 + 20).toFixed(2);
        }

        function gerarPromocao(id) {
            const emPromocao = (id % 4 === 0);
            const precoOriginal = parseFloat(gerarPreco(id));
            if (!emPromocao) return { emPromocao: false, precoOriginal, precoAtual: precoOriginal, desconto: 0 };
            const descontoSemente = (id * 1234567) % 100;
            const desconto = 10 + (descontoSemente % 51);
            const precoAtual = (precoOriginal * (1 - desconto / 100)).toFixed(2);
            return { emPromocao: true, precoOriginal: precoOriginal.toFixed(2), precoAtual, desconto };
        }

        function montaPreco(id) {
            const promo = gerarPromocao(id);
            if (!promo.emPromocao) {
                return `<p class="fw-bold mb-2">R$ ${promo.precoOriginal}</p>`;
            }
            return `
                <div class="mb-2">
                    <div class="d-flex align-items-center gap-1 mb-1">
                        <span class="badge text-white" style="background-color:#6610f2; font-size:0.7rem;">-${promo.desconto}%</span>
                        <span class="text-muted text-decoration-line-through" style="font-size:0.8rem;">R$ ${promo.precoOriginal}</span>
                    </div>
                    <span class="fw-bold text-warning">R$ ${promo.precoAtual}</span>
                </div>
            `;
        }

        function renderizarPaginacao() {
            const paginacao = document.getElementById('paginacao');
            paginacao.innerHTML = '';

            paginacao.innerHTML += `
                <li class="page-item ${paginaAtual === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="trocarPagina(${paginaAtual - 1})">Anterior</a>
                </li>`;

            const inicio = Math.max(1, paginaAtual - 2);
            const fim = Math.min(totalPaginas, paginaAtual + 2);

            if (inicio > 1) {
                paginacao.innerHTML += `<li class="page-item"><a class="page-link" href="#" onclick="trocarPagina(1)">1</a></li>`;
                if (inicio > 2) paginacao.innerHTML += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
            }

            for (let i = inicio; i <= fim; i++) {
                paginacao.innerHTML += `
                    <li class="page-item ${i === paginaAtual ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="trocarPagina(${i})">${i}</a>
                    </li>`;
            }

            if (fim < totalPaginas) {
                if (fim < totalPaginas - 1) paginacao.innerHTML += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                paginacao.innerHTML += `<li class="page-item"><a class="page-link" href="#" onclick="trocarPagina(${totalPaginas})">${totalPaginas}</a></li>`;
            }

            paginacao.innerHTML += `
                <li class="page-item ${paginaAtual === totalPaginas ? 'disabled' : ''}">
                    <a class="page-link" href="#" onclick="trocarPagina(${paginaAtual + 1})">Próximo</a>
                </li>`;
        }

        function trocarPagina(pagina) {
            if (pagina < 1 || pagina > totalPaginas) return;
            paginaAtual = pagina;
            carregarJogos(paginaAtual);
        }

        carregarJogos(1);

        // Ativa todos os tooltips da página
        document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => {
            new bootstrap.Tooltip(el);
        });

        // ── Sistema de login ──────────────────────────────────────
        function atualizarAreaLogin() {
            const usuario = localStorage.getItem('orbitUsuario');
            const area = document.getElementById('areaLogin');

            if (usuario) {
                area.innerHTML = `
            <div class="dropdown">
                <span class="text-white fw-bold dropdown-toggle" style="cursor:pointer; font-size:0.95rem;"
                      data-bs-toggle="dropdown">
                    👤 ${usuario}
                </span>
                <ul class="dropdown-menu dropdown-menu-end" style="background-color:#1a1a2e; border-color:#6610f2;">
                    <li>
                        <button class="dropdown-item text-danger" onclick="sairConta()">Sair</button>
                    </li>
                </ul>
            </div>
        `;
            } else {
                area.innerHTML = `
            <img src="./LoginIcon.png" alt="Login" width="36" height="36"
                 style="cursor:pointer;"
                 data-bs-toggle="modal" data-bs-target="#modalLogin"
                 title="Criar conta / Entrar">
        `;
            }
        }

        function criarConta() {
            const usuario = document.getElementById('inputUsuario').value.trim();
            const email = document.getElementById('inputEmail').value.trim();
            const senha = document.getElementById('inputSenha').value;
            const erro = document.getElementById('erroLogin');

            if (!usuario || !email || !senha) {
                erro.textContent = 'Por favor, preencha todos os campos.';
                erro.style.display = 'block';
                return;
            }

            if (senha.length < 6) {
                erro.textContent = 'A senha deve ter pelo menos 6 caracteres.';
                erro.style.display = 'block';
                return;
            }

            localStorage.setItem('orbitUsuario', usuario);
            localStorage.setItem('orbitEmail', email);

            bootstrap.Modal.getInstance(document.getElementById('modalLogin')).hide();
            atualizarAreaLogin();

            document.getElementById('inputUsuario').value = '';
            document.getElementById('inputEmail').value = '';
            document.getElementById('inputSenha').value = '';
            erro.style.display = 'none';
        }

        function sairConta() {
            localStorage.removeItem('orbitUsuario');
            localStorage.removeItem('orbitEmail');
            atualizarAreaLogin();
        }

        atualizarAreaLogin();

        // ── Busca ────────────────────────────────────────────────
        function buscar(event) {
            event.preventDefault();
            const termo = document.getElementById('campoBusca').value.trim();
            if (termo) {
                window.location.href = `resultado.html?q=${encodeURIComponent(termo)}`;
            }
        }
    </script>

</body>

</html>
