<!doctype html>
<html lang="pt-br" data-bs-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="./planet.png">
    <title>Carrinho — Orbit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body { background-image: linear-gradient(to right, #141425, #1f1c3e); }
        .orbitmain { background-color: #6610f2; }

        .item-carrinho {
            background-color: #1a1a2e;
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .item-carrinho img {
            width: 100px;
            height: 65px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .item-nome {
            font-weight: 600;
            font-size: 1rem;
        }

        .item-preco {
            font-weight: 700;
            color: #a87aff;
            font-size: 1rem;
            white-space: nowrap;
        }

        .btn-remover {
            background: none;
            border: none;
            color: #888;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
            flex-shrink: 0;
        }
        .btn-remover:hover { color: #e74c3c; }

        .resumo-box {
            background-color: #1a1a2e;
            border-radius: 10px;
            padding: 1.5rem;
            position: sticky;
            top: 20px;
        }

        .btn-comprar {
            background-color: #6610f2;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 8px;
            width: 100%;
            transition: background 0.2s;
            cursor: pointer;
        }
        .btn-comprar:hover:not(:disabled) { background-color: #4a0ab5; }
        .btn-comprar:disabled {
            background-color: #444;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .carrinho-vazio {
            text-align: center;
            padding: 5rem 0;
        }
        .carrinho-vazio i { font-size: 4rem; color: #444; }

        /* Modal de confirmação de compra */
        .modal-compra .modal-content {
            background-color: #1a1a2e;
            border: 1px solid #6610f2;
        }
    </style>
</head>

<body>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg orbitmain">
        <div class="container-xl">
            <a class="navbar-brand" href="index.html" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Página Inicial">
                <img src="./orbitlogo.png" alt="Logo" width="125" height="75" class="object-fit-cover" />
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-light" href="biblioteca.html">Biblioteca</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-light" href="catalogo.html">Catálogo</a>
                    </li>
                </ul>
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <a class="nav-link active text-light" href="carrinho.html">
                        <img src="./carrinhoicon.png" alt="Carrinho" width="30" height="30" class="m-3" />
                    </a>
                </div>
                <form class="d-flex" role="search" onsubmit="buscar(event)">
                    <input class="form-control me-2" type="search" id="campoBusca" placeholder="Buscar jogos..." aria-label="Search" style="background-color: #1f1c3e;" />
                    <button class="btn btn-outline-light" type="submit">Buscar</button>
                </form>
                <div class="ms-3 d-flex align-items-center" id="areaLogin"></div>
            </div>
        </div>
    </nav>

    <!-- Modal de login/cadastro -->
    <div class="modal fade" id="modalLogin" tabindex="-1" aria-labelledby="modalLoginLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: #1a1a2e; border: 1px solid #6610f2;">
                <div class="modal-header border-0 pb-0">
                    <div class="w-100">
                        <h5 class="modal-title text-white mb-3" id="modalLoginLabel">Bem-vindo à Orbit</h5>
                        <!-- Abas -->
                        <ul class="nav nav-tabs border-0" id="abasLogin">
                            <li class="nav-item">
                                <button class="nav-link active text-white" id="abaEntrar" onclick="trocarAba('entrar')"
                                    style="background:none; border-bottom: 2px solid #6610f2;">Entrar</button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link text-muted" id="abaCriar" onclick="trocarAba('criar')"
                                    style="background:none; border:none;">Criar conta</button>
                            </li>
                        </ul>
                    </div>
                    <button type="button" class="btn-close btn-close-white ms-2" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pt-3">

                    <!-- Aba Entrar -->
                    <div id="painelEntrar">
                        <div class="mb-3">
                            <label class="form-label text-light">Nome de usuário</label>
                            <input type="text" class="form-control" id="loginUsuario" placeholder="Seu nome de usuário"
                                style="background-color: #0d0d1a; border-color: #6610f2; color: white;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light">Senha</label>
                            <input type="password" class="form-control" id="loginSenha" placeholder="••••••••"
                                style="background-color: #0d0d1a; border-color: #6610f2; color: white;">
                        </div>
                        <p id="erroEntrar" class="text-danger" style="font-size: 0.85rem; display: none;"></p>
                        <button type="button" class="btn w-100 text-white fw-bold" style="background-color: #6610f2;"
                            onclick="entrarConta()">Entrar</button>
                    </div>

                    <!-- Aba Criar conta -->
                    <div id="painelCriar" style="display:none;">
                        <div class="mb-3">
                            <label class="form-label text-light">Nome de usuário</label>
                            <input type="text" class="form-control" id="inputUsuario" placeholder="Seu nome de usuário"
                                style="background-color: #0d0d1a; border-color: #6610f2; color: white;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light">Email</label>
                            <input type="email" class="form-control" id="inputEmail" placeholder="seu@email.com"
                                style="background-color: #0d0d1a; border-color: #6610f2; color: white;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-light">Senha</label>
                            <input type="password" class="form-control" id="inputSenha" placeholder="••••••••"
                                style="background-color: #0d0d1a; border-color: #6610f2; color: white;">
                        </div>
                        <p id="erroLogin" class="text-danger" style="font-size: 0.85rem; display: none;"></p>
                        <button type="button" class="btn w-100 text-white fw-bold" style="background-color: #6610f2;"
                            onclick="criarConta()">Criar conta</button>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Modal de compra confirmada -->
    <div class="modal fade modal-compra" id="modalCompra" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4">
                <div class="mb-3" style="font-size: 3.5rem;">🎉</div>
                <h4 class="text-white fw-bold mb-2">Compra realizada!</h4>
                <p class="text-muted mb-1">Seus jogos foram adicionados à sua biblioteca.</p>
                <p class="text-muted mb-4" id="msgContaCompra" style="font-size:0.85rem;"></p>
                <div class="d-flex gap-2 justify-content-center">
                    <a href="biblioteca.html" class="btn text-white" style="background-color:#6610f2;">
                        Ver Biblioteca
                    </a>
                    <a href="catalogo.html" class="btn btn-outline-light">
                        Continuar comprando
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Conteúdo -->
    <div class="container-xl mt-5 mb-5">
        <h2 class="mb-4 fw-bold">🛒 Carrinho</h2>

        <div class="row g-4">

            <!-- Lista de itens -->
            <div class="col-lg-8">
                <div id="listaCarrinho">
                    <!-- Preenchido pelo JS -->
                </div>
            </div>

            <!-- Resumo -->
            <div class="col-lg-4">
                <div class="resumo-box">
                    <h5 class="text-white fw-bold mb-4">Resumo do pedido</h5>

                    <div class="d-flex justify-content-between mb-2 text-muted" style="font-size:0.9rem;">
                        <span id="qtdItens">0 itens</span>
                        <span id="subtotal">R$ 0,00</span>
                    </div>

                    <hr style="border-color:#333;">

                    <div class="d-flex justify-content-between mb-4">
                        <span class="text-white fw-bold">Total</span>
                        <span class="text-white fw-bold fs-5" id="total">R$ 0,00</span>
                    </div>

                    <!-- Aviso de login -->
                    <div id="avisoLogin" class="alert mb-3 text-center" style="background-color:#2a1a1a; border-color:#6610f2; color:#ff9999; font-size:0.85rem; display:none;">
                        <i class="bi bi-lock-fill me-1"></i>
                        Faça login para finalizar a compra
                    </div>

                    <button class="btn-comprar" id="btnComprar" onclick="finalizarCompra()" disabled>
                        Finalizar compra
                    </button>
                </div>
            </div>

        </div>
    </div>

    <div class="container-xl mb-5">
        <hr>
        <p class="text-center text-muted">© 2026 Orbit. Todos os direitos reservados.</p>
    </div>

    <script>

        // ── Renderizar carrinho ─────────────────────────────────
        function renderizarCarrinho() {
            const carrinho = JSON.parse(localStorage.getItem('orbitCarrinho') ?? '[]');
            const lista = document.getElementById('listaCarrinho');
            const usuario = localStorage.getItem('orbitUsuario');

            // Atualiza estado do botão de compra
            const btnComprar = document.getElementById('btnComprar');
            const avisoLogin = document.getElementById('avisoLogin');

            if (!usuario) {
                btnComprar.disabled = true;
                avisoLogin.style.display = 'block';
            } else {
                btnComprar.disabled = carrinho.length === 0;
                avisoLogin.style.display = 'none';
            }

            if (carrinho.length === 0) {
                lista.innerHTML = `
                    <div class="carrinho-vazio">
                        <i class="bi bi-cart-x"></i>
                        <p class="text-muted mt-3 fs-5">Seu carrinho está vazio.</p>
                        <a href="catalogo.html" class="btn text-white mt-2" style="background-color:#6610f2;">
                            Explorar catálogo
                        </a>
                    </div>
                `;
                atualizarTotal([]);
                return;
            }

            lista.innerHTML = '';
            carrinho.forEach((item, index) => {
                lista.innerHTML += `
                    <div class="item-carrinho">
                        <img src="${item.capa}" alt="${item.nome}" onerror="this.src='imagem-padrao.jpg'">
                        <div class="flex-grow-1">
                            <div class="item-nome text-white">${item.nome}</div>
                            <div class="text-muted" style="font-size:0.8rem;">Jogo digital</div>
                        </div>
                        <div class="item-preco">R$ ${parseFloat(item.preco).toFixed(2)}</div>
                        <button class="btn-remover" onclick="removerItem(${index})" title="Remover">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                `;
            });

            atualizarTotal(carrinho);
        }

        function atualizarTotal(carrinho) {
            const total = carrinho.reduce((acc, item) => acc + parseFloat(item.preco), 0);
            const qtd = carrinho.length;
            document.getElementById('qtdItens').textContent = `${qtd} item(s)`;
            document.getElementById('subtotal').textContent = `R$ ${total.toFixed(2)}`;
            document.getElementById('total').textContent = `R$ ${total.toFixed(2)}`;
        }

        function removerItem(index) {
            const carrinho = JSON.parse(localStorage.getItem('orbitCarrinho') ?? '[]');
            carrinho.splice(index, 1);
            localStorage.setItem('orbitCarrinho', JSON.stringify(carrinho));
            renderizarCarrinho();
        }

        // ── Finalizar compra ────────────────────────────────────
        function finalizarCompra() {
            const usuario = localStorage.getItem('orbitUsuario');
            if (!usuario) return;

            const carrinho = JSON.parse(localStorage.getItem('orbitCarrinho') ?? '[]');
            if (carrinho.length === 0) return;

            // Salva jogos obtidos vinculados ao usuário
            const chave = `orbitBiblioteca_${usuario}`;
            const biblioteca = JSON.parse(localStorage.getItem(chave) ?? '[]');

            carrinho.forEach(item => {
                const jaTemJogo = biblioteca.some(j => j.id === item.id);
                if (!jaTemJogo) {
                    biblioteca.push({
                        id: item.id,
                        nome: item.nome,
                        capa: item.capa,
                        preco: item.preco,
                        obtidoEm: new Date().toLocaleDateString('pt-BR')
                    });
                }
            });

            localStorage.setItem(chave, JSON.stringify(biblioteca));

            // Limpa o carrinho
            localStorage.removeItem('orbitCarrinho');

            // Mostra modal de confirmação
            document.getElementById('msgContaCompra').textContent =
                `Jogos adicionados à biblioteca de "${usuario}"`;
            new bootstrap.Modal(document.getElementById('modalCompra')).show();

            renderizarCarrinho();
        }

        // ── Busca ────────────────────────────────────────────────
        function buscar(event) {
            event.preventDefault();
            const termo = document.getElementById('campoBusca').value.trim();
            if (termo) window.location.href = `resultado.html?q=${encodeURIComponent(termo)}`;
        }

        // ── Login ─────────────────────────────────────────────────
        function atualizarAreaLogin() {
            const usuario = localStorage.getItem('orbitUsuario');
            const area = document.getElementById('areaLogin');
            if (usuario) {
                area.innerHTML = `
                    <div class="dropdown">
                        <span class="text-white fw-bold dropdown-toggle" style="cursor:pointer; font-size:0.95rem;"
                              data-bs-toggle="dropdown">👤 ${usuario}</span>
                        <ul class="dropdown-menu dropdown-menu-end" style="background-color:#1a1a2e; border-color:#6610f2;">
                            <li><button class="dropdown-item text-danger" onclick="sairConta()">Sair</button></li>
                        </ul>
                    </div>`;
            } else {
                area.innerHTML = `
                    <img src="./LoginIcon.png" alt="Login" width="36" height="36"
                         style="cursor:pointer;"
                         data-bs-toggle="modal" data-bs-target="#modalLogin"
                         title="Criar conta / Entrar">`;
            }
            // Atualiza botão de compra conforme estado do login
            renderizarCarrinho();
        }

                function trocarAba(aba) {
            const entrar = document.getElementById('painelEntrar');
            const criar  = document.getElementById('painelCriar');
            const abaE   = document.getElementById('abaEntrar');
            const abaC   = document.getElementById('abaCriar');
            if (aba === 'entrar') {
                entrar.style.display = 'block'; criar.style.display = 'none';
                abaE.classList.add('active'); abaE.style.borderBottom = '2px solid #6610f2'; abaE.classList.remove('text-muted'); abaE.classList.add('text-white');
                abaC.classList.remove('active'); abaC.style.borderBottom = 'none'; abaC.classList.add('text-muted'); abaC.classList.remove('text-white');
            } else {
                criar.style.display = 'block'; entrar.style.display = 'none';
                abaC.classList.add('active'); abaC.style.borderBottom = '2px solid #6610f2'; abaC.classList.remove('text-muted'); abaC.classList.add('text-white');
                abaE.classList.remove('active'); abaE.style.borderBottom = 'none'; abaE.classList.add('text-muted'); abaE.classList.remove('text-white');
            }
        }

        function entrarConta() {
            const usuario = document.getElementById('loginUsuario').value.trim();
            const senha   = document.getElementById('loginSenha').value;
            const erro    = document.getElementById('erroEntrar');
            if (!usuario || !senha) { erro.textContent = 'Preencha o nome de usuário e a senha.'; erro.style.display = 'block'; return; }
            const contas = JSON.parse(localStorage.getItem('orbitContas') ?? '[]');
            const conta = contas.find(c => c.usuario === usuario);
            if (!conta) { erro.textContent = 'Usuário não encontrado.'; erro.style.display = 'block'; return; }
            if (conta.senha !== senha) { erro.textContent = 'Senha incorreta.'; erro.style.display = 'block'; return; }
            localStorage.setItem('orbitUsuario', usuario);
            localStorage.setItem('orbitEmail', conta.email);
            bootstrap.Modal.getInstance(document.getElementById('modalLogin')).hide();
            document.getElementById('loginUsuario').value = '';
            document.getElementById('loginSenha').value = '';
            erro.style.display = 'none';
            atualizarAreaLogin();
        }

        function criarConta() {
            const usuario = document.getElementById('inputUsuario').value.trim();
            const email   = document.getElementById('inputEmail').value.trim();
            const senha   = document.getElementById('inputSenha').value;
            const erro    = document.getElementById('erroLogin');
            if (!usuario || !email || !senha) { erro.textContent = 'Por favor, preencha todos os campos.'; erro.style.display = 'block'; return; }
            if (senha.length < 6) { erro.textContent = 'A senha deve ter pelo menos 6 caracteres.'; erro.style.display = 'block'; return; }
            const contas = JSON.parse(localStorage.getItem('orbitContas') ?? '[]');
            if (contas.some(c => c.usuario === usuario)) { erro.textContent = 'Este nome de usuário já está em uso.'; erro.style.display = 'block'; return; }
            if (contas.some(c => c.email === email)) { erro.textContent = 'Este email já está cadastrado.'; erro.style.display = 'block'; return; }
            contas.push({ usuario, email, senha });
            localStorage.setItem('orbitContas', JSON.stringify(contas));
            localStorage.setItem('orbitUsuario', usuario);
            localStorage.setItem('orbitEmail', email);
            bootstrap.Modal.getInstance(document.getElementById('modalLogin')).hide();
            atualizarAreaLogin();
            document.getElementById('inputUsuario').value = '';
            document.getElementById('inputEmail').value = '';
            document.getElementById('inputSenha').value = '';
            erro.style.display = 'none';
        }

        function sairConta() {
            localStorage.removeItem('orbitUsuario');
            localStorage.removeItem('orbitEmail');
            atualizarAreaLogin();
        }

        document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));
        atualizarAreaLogin();
    </script>

</body>
</html>
